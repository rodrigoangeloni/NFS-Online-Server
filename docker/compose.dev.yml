# Local Docker Desktop stack for U2/MW smoke tests.
# The nfs-web service is added by the web implementation tasks.
services:
  nfs-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: nfs-server-dev
    environment:
      NFS_GAMES: u2,mw
      NFS_PUBLIC_HOST: ${NFS_PUBLIC_HOST:-127.0.0.1}
      NFS_LOCAL_IPV4: ${NFS_LOCAL_IPV4:-127.0.0.1}
      NFS_LOG_LEVEL: INFO
    ports:
      - "13505:13505"
      - "20921:20921"
      - "20922:20922"
      - "20923:20923"
      - "30920:30920"
      - "30921:30921"
      - "20000-20005:20000-20005/udp"
    volumes:
      - ../data:/app/data
      - ../runtime:/app/runtime
      - ../logs:/app/logs
      - ../config:/app/config:ro
    restart: unless-stopped

  nfs-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: nfs-web-dev
    environment:
      NFS_WEB_CONFIG: /app/config/server.toml
      NFS_WEB_PUBLIC_HOST: ${NFS_WEB_PUBLIC_HOST:-127.0.0.1}
      NFS_WEB_SITE_URL: ${NFS_WEB_SITE_URL:-http://127.0.0.1:8080}
      NFS_WEB_DOWNLOADS_DIR: /app/downloads
      NFS_WEB_ALLOW_INSECURE: "1"
      NFS_WEB_INVITE_REQUIRED: ${NFS_WEB_INVITE_REQUIRED:-1}
    ports:
      - "0.0.0.0:8081:8080"
    volumes:
      - ../data:/app/data
      - ../runtime:/app/runtime:ro
      - ../config:/app/config:ro
      - ../server:/app/server:ro
      - ../web:/app/web:ro
      - ${NFS_DOWNLOADS_DIR:-../../NFS-Online-Artifacts/downloads}:/app/downloads:ro
    restart: unless-stopped
